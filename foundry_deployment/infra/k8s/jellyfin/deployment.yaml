apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels: &labels
    app: jellyfin
  namespace: jellyfin
spec:
  selector:
    matchLabels: *labels
  replicas: 1
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8096
              protocol: TCP
            - containerPort: 7359
              protocol: UDP
          resources:
            requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi }
            limits: { cpu: 6, memory: 1536Mi, ephemeral-storage: 2Gi }
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-media
              mountPath: /media
      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-pvc
        - name: jellyfin-media
          persistentVolumeClaim:
            claimName: jellyfin-media-pvc