apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry
  labels: &labels
    app: foundry
  namespace: foundry
spec:
  selector:
    matchLabels: *labels
  replicas: 1
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: foundry
          image: docker.io/mephalrith/foundry-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 30000
          resources:
            requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi }
            limits: { cpu: 4, memory: 3Gi, ephemeral-storage: 4Gi }
          volumeMounts:
            - mountPath: "/foundrydata"
              name: foundry-pv-storage
      volumes:
        - name: foundry-pv-storage
          persistentVolumeClaim:
            claimName: foundry-pvc