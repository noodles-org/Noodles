apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-slo-core-apps
  namespace: monitoring
  annotations:
    grafana_folder: "SLO"
  labels:
    grafana_dashboard: "1"
data:
  slo-core-apps.json: |-
    {
      "uid": "slo-core-applications",
      "title": "SLO - Core Applications & APIs",
      "tags": ["slo", "sli", "applications", "dashboard", "dex", "foundry"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "SLO Summary & Error Budgets",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Dashboard Availability (Target: 99.5%)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "targets": [
            {
              "expr": "clamp_max((sum(rate(dashboard_http_requests_total{status_code!~\"5..\"}[24h])) or vector(1)) / (sum(rate(dashboard_http_requests_total[24h])) or vector(1)) * 100, 100)",
              "legendFormat": "Availability"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 99.0 },
                  { "color": "green", "value": 99.5 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          }
        },
        {
          "type": "stat",
          "title": "Dashboard Latency < 500ms (Target: 80.0%)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "targets": [
            {
              "expr": "clamp_max((sum(rate(dashboard_http_request_duration_seconds_bucket{le=\"0.5\", route!=\"unmatched\"}[24h])) or vector(1)) / (sum(rate(dashboard_http_request_duration_seconds_count{route!=\"unmatched\"}[24h])) or vector(1)) * 100, 100)",
              "legendFormat": "Latency Compliance"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 78.0 },
                  { "color": "green", "value": 80.0 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          }
        },
        {
          "type": "stat",
          "title": "Dex OIDC Availability (Target: 99.9%)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "targets": [
            {
              "expr": "clamp_max((sum(rate(traefik_service_requests_total{service=~\"auth-dex.*\", code!~\"5..\"}[24h])) or vector(1)) / (sum(rate(traefik_service_requests_total{service=~\"auth-dex.*\"}[24h])) or vector(1)) * 100, 100)",
              "legendFormat": "Dex SLI"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 99.5 },
                  { "color": "green", "value": 99.9 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          }
        },
        {
          "type": "stat",
          "title": "FoundryVTT Availability (Target: 99.0%)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "targets": [
            {
              "expr": "clamp_max((sum(rate(traefik_service_requests_total{service=~\"foundry-foundry.*\", code!~\"5..\"}[24h])) or vector(1)) / (sum(rate(traefik_service_requests_total{service=~\"foundry-foundry.*\"}[24h])) or vector(1)) * 100, 100)",
              "legendFormat": "Foundry SLI"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 98.0 },
                  { "color": "green", "value": 99.0 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          }
        },
        {
          "type": "row",
          "title": "Noodles Dashboard App SLIs",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 101,
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Dashboard Availability SLI (Rolling 1h vs Target 99.5%)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
          "id": 11,
          "targets": [
            {
              "expr": "clamp_max((sum(rate(dashboard_http_requests_total{status_code!~\"5..\"}[1h])) or vector(1)) / (sum(rate(dashboard_http_requests_total[1h])) or vector(1)) * 100, 100)",
              "legendFormat": "Current SLI (1h)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 90,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 99.5 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Dashboard Latency Percentiles (p50, p90, p95, p99)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
          "id": 12,
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(dashboard_http_request_duration_seconds_bucket{route!=\"unmatched\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(dashboard_http_request_duration_seconds_bucket{route!=\"unmatched\"}[5m])) by (le))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(dashboard_http_request_duration_seconds_bucket{route!=\"unmatched\"}[5m])) by (le))",
              "legendFormat": "p95 (SLO <= 0.5s)"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(dashboard_http_request_duration_seconds_bucket{route!=\"unmatched\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "lineWidth": 2 }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Dashboard Error Budget Burn Rate (1h & 6h)",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 14 },
          "id": 13,
          "targets": [
            {
              "expr": "(sum(rate(dashboard_http_requests_total{status_code=~\"5..\"}[1h])) / sum(rate(dashboard_http_requests_total[1h]))) / (1 - 0.995)",
              "legendFormat": "1h Burn Rate (Alert > 14.4)"
            },
            {
              "expr": "(sum(rate(dashboard_http_requests_total{status_code=~\"5..\"}[6h])) / sum(rate(dashboard_http_requests_total[6h]))) / (1 - 0.995)",
              "legendFormat": "6h Burn Rate (Alert > 6.0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 6.0 },
                  { "color": "red", "value": 14.4 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Auth Success vs Failure SLI Rate",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 14 },
          "id": 14,
          "targets": [
            {
              "expr": "sum(rate(dashboard_auth_events_total{status=\"success\"}[5m])) or vector(0)",
              "legendFormat": "Auth Success Rate"
            },
            {
              "expr": "sum(rate(dashboard_auth_events_total{status=\"failure\"}[5m])) or vector(0)",
              "legendFormat": "Auth Failure Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "fillOpacity": 40 }
            }
          }
        },
        {
          "type": "row",
          "title": "Dex OIDC & FoundryVTT Ingress Health",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 20 },
          "id": 102,
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Dex Ingress Request Rate & Error Rate",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 21 },
          "id": 21,
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"auth-dex.*\", code!~\"5..\"}[5m]))",
              "legendFormat": "Dex 2xx/3xx/4xx Rate"
            },
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"auth-dex.*\", code=~\"5..\"}[5m]))",
              "legendFormat": "Dex 5xx Error Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2 }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Foundry Ingress Request Rate & Error Rate",
          "datasource": { "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 21 },
          "id": 22,
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"foundry-foundry.*\", code!~\"5..\"}[5m]))",
              "legendFormat": "Foundry 2xx/3xx/4xx Rate"
            },
            {
              "expr": "sum(rate(traefik_service_requests_total{service=~\"foundry-foundry.*\", code=~\"5..\"}[5m]))",
              "legendFormat": "Foundry 5xx Error Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2 }
            }
          }
        }
      ]
    }
