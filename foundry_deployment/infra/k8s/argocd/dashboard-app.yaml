apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: dashboard-project
  source:
    repoURL: https://github.com/noodles-org/Noodles
    targetRevision: HEAD
    path: foundry_deployment/infra/k8s/dashboard
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: dashboard
  # The client registry ConfigMaps are shipped as empty shells and owned by the
  # dashboard backend at runtime; never reconcile their contents away.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: noodles-clients
      namespace: dashboard
      jsonPointers:
        - /data
    - group: ""
      kind: ConfigMap
      name: noodles-clients-pending
      namespace: dashboard
      jsonPointers:
        - /data
