# Pending client access requests.
#
# DO NOT POPULATE THIS FILE. It is an empty bootstrap shell so the object exists
# on a fresh cluster; the dashboard backend writes pending entries at runtime and
# the weekly flush CronJob clears them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noodles-clients-pending
  namespace: dashboard
  labels:
    app: dashboard
  annotations:
    argocd.argoproj.io/sync-options: Prune=false, RespectIgnoreDifferences=true
