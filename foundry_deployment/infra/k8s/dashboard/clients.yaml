# Approved client registry.
#
# DO NOT POPULATE THIS FILE. It is an empty bootstrap shell so the object exists
# on a fresh cluster; the dashboard backend owns its contents at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noodles-clients
  namespace: dashboard
  labels:
    app: dashboard
  annotations:
    argocd.argoproj.io/sync-options: Prune=false, RespectIgnoreDifferences=true
