  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    name: "noodles-org:developer"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "noodles-org:admin"
    apiGroup: rbac.authorization.k8s.io
