# Dex OIDC RBAC for the games cluster.
# Mirrors foundry_deployment/infra/k8s/auth/rbac.yaml — keep role mappings in sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dex-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: "noodles-org:admin"
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-games-developer
  namespace: satisfactory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    name: "noodles-org:developer"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "noodles-org:admin"
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-games-developer
  namespace: enshrouded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    name: "noodles-org:developer"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "noodles-org:admin"
    apiGroup: rbac.authorization.k8s.io
---
